<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>WhatsApp Clone | Login</title>

    <link rel="stylesheet" href="css/login.css">

</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">

            💬

        </div>

        <h1>WhatsApp Clone</h1>

        <p>Login to continue</p>

        <form id="loginForm">

            <div class="input-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>

            </div>

            <button type="submit">

                Login

            </button>

        </form>

        <p class="bottom-text">

            Don't have an account?

            <a href="signup.html">

                Create One

            </a>

        </p>

    </div>

</div>

<script src="js/login.js"></script>

</body>

</html>
